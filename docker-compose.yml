services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GENERATION_MODEL=${GENERATION_MODEL:-claude-sonnet-4-6}
    volumes:
      - ./data:/app/data

  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GENERATION_MODEL=${GENERATION_MODEL:-claude-sonnet-4-6}
    volumes:
      - ./data:/app/data
